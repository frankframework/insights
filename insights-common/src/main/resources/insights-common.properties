spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.batch_versioned_data=true

management.endpoints.web.exposure.include=info,health
management.info.build.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

github.graphql.url=https://api.github.com/graphql
github.rest.url=https://api.github.com

github.graphql.branch-protection-regexes[0]=^master$
github.graphql.branch-protection-regexes[1]=^release/[0-9]+\\.[0-9]+$
github.graphql.branch-protection-regexes[2]=^[0-9]+\\.[0-9]+-release$

github.graphql.includedLabels[0]=FEF2C0
github.graphql.includedLabels[1]=D4C5F9
github.graphql.includedLabels[2]=006B75
github.graphql.includedLabels[3]=C5DEF5
