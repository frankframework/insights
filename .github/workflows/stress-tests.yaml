name: Stress tests

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The image tag (commit SHA) to run stress tests against'
        required: true

jobs:
  stress-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The images copy the jars out of the target directories, so they have to be built first.
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Build the service jars
        run: mvn -B clean package -DskipTests

      - name: Start Services with Docker Compose
        run: docker compose up -d --build

      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Stress test Backend
        run: ab -r -n 1000 -c 50 http://localhost:8080/api/releases > backend-stress.log || true

      - name: Stress test Frontend
        run: ab -r -n 1000 -c 50 http://localhost:8080/ > frontend-stress.log || true

      - name: Upload Apache Bench logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apache-bench-logs
          path: |
            stress.log
