<span
  class="stat-label inline-flex items-center gap-1 text-[0.625rem] font-semibold tracking-wide text-gray-400 uppercase"
>
  {{ label() }}
  @if (info()) {
    <span class="inline-flex items-center justify-center text-gray-400" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" class="size-3">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
        <circle cx="8" cy="4.75" r="0.9" fill="currentColor" />
        <path d="M8 7.25v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </span>
  }
</span>
<span [class]="valueClasses()">{{ value() }}</span>
