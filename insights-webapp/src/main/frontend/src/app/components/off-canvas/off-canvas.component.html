<div
  class="fixed top-0 right-0 z-[25] h-screen w-[30vw] translate-x-0 overflow-hidden bg-white/98 shadow-[-6px_0_32px_rgba(0,0,0,0.12)] transition-transform duration-[350ms] ease-[cubic-bezier(0.4,0,0.2,1)] max-[992px]:left-0 max-[992px]:z-[19] max-[992px]:w-screen max-[992px]:min-w-0 max-[992px]:max-w-none max-[992px]:rounded-none max-[992px]:bg-white/99 max-[992px]:pt-[9vh] max-[992px]:shadow-none"
>
  <div class="relative h-full px-6 pt-12 pb-6">
    @if (title(); as canvasTitle) {
      <h4 class="off-canvas-title absolute top-2 left-2 m-2 ml-6 text-[1.1rem] font-bold">{{ canvasTitle }}</h4>
    }
    <button class="absolute top-2 right-2 cursor-pointer text-2xl hover:text-red-700" (click)="onClose()">✕</button>
    <ng-content />
  </div>
</div>
