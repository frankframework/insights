<div class="grab-gesture my-8 flex h-[200px] w-[270px] flex-col items-center justify-center gap-8">
  <img
    alt="Gesture image"
    class="h-auto w-1/2 animate-[grab-move-right_2.5s_infinite_ease-in-out]"
    [src]="imageSrc()"
  />
  <span class="text-center">{{ gestureDescription() }}</span>
</div>
