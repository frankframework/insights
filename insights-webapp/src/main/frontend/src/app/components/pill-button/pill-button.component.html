<button
  type="button"
  [class]="buttonClasses()"
  [disabled]="disabled() || loading()"
  [attr.title]="tooltip() || null"
  (click)="clicked.emit()"
>
  <span aria-hidden="true" [class]="iconClasses()" [style.maskImage]="iconMask()"></span>
  <span [class]="labelClasses()">{{ label() }}</span>
</button>
