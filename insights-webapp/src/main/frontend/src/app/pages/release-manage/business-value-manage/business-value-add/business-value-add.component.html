<app-modal title="Add Business Value" [closeOnBackdropClick]="false" (closed)="close()">
  <div class="w-full py-4 max-md:py-2">
    @if (errorMessage()) {
      <div
        class="error-message mb-6 rounded-md border border-red-200 bg-red-100 px-4 py-3 text-sm text-red-800 max-sm:mb-4 max-sm:px-3.5 max-sm:py-2.5 max-sm:text-[0.8125rem]"
      >
        {{ errorMessage() }}
      </div>
    }

    <div class="mb-6 max-sm:mb-5">
      <label class="mb-2 block text-[0.9375rem] font-semibold text-gray-700 max-sm:mb-1.5 max-sm:text-sm" for="bv-name">
        Title <span class="text-red-600">*</span>
      </label>
      <input
        id="bv-name"
        type="text"
        class="w-full rounded-lg border-[1.5px] border-gray-300 px-4 py-3 font-[inherit] text-[0.9375rem] text-gray-800 transition-all duration-200 placeholder:text-gray-400 focus:border-blue-500 focus:shadow-ring focus:outline-none disabled:cursor-not-allowed disabled:bg-gray-50 max-sm:border max-sm:px-3.5 max-sm:py-2.5 max-sm:text-sm"
        placeholder="Enter business value title"
        [value]="name()"
        [disabled]="isSaving()"
        (input)="updateName($event)"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      />
    </div>

    <div class="mb-6 max-sm:mb-5">
      <div class="mb-2 flex items-center justify-between">
        <label class="text-[0.9375rem] font-semibold text-gray-700 max-sm:text-sm" for="bv-description">
          Description <span class="text-red-600">*</span>
        </label>
        <div class="flex gap-0.5 rounded-md bg-gray-100 p-0.5">
          <button
            type="button"
            [class]="
              'cursor-pointer rounded px-3 py-1 text-[0.8rem] font-medium ' +
              (!descriptionPreview() ? 'active bg-white text-gray-800 shadow-e1' : 'bg-transparent text-gray-500')
            "
            (click)="descriptionPreview.set(false)"
            (keydown)="$event.stopPropagation()"
          >
            Write
          </button>
          <button
            type="button"
            [class]="
              'cursor-pointer rounded px-3 py-1 text-[0.8rem] font-medium ' +
              (descriptionPreview() ? 'active bg-white text-gray-800 shadow-e1' : 'bg-transparent text-gray-500')
            "
            (click)="descriptionPreview.set(true)"
            (keydown)="$event.stopPropagation()"
          >
            Preview
          </button>
        </div>
      </div>
      @if (descriptionPreview()) {
        <div
          class="markdown-body min-h-30 rounded-lg border-[1.5px] border-gray-300 px-4 py-3 text-[0.9375rem] text-gray-800"
          [innerHTML]="description() | markdown"
        ></div>
      } @else {
        <textarea
          id="bv-description"
          class="min-h-55 w-full resize-y rounded-lg border-[1.5px] border-gray-300 px-4 py-3 font-[inherit] text-[0.9375rem] text-gray-800 transition-all duration-200 placeholder:text-gray-400 focus:border-blue-500 focus:shadow-ring focus:outline-none disabled:cursor-not-allowed disabled:bg-gray-50 max-md:min-h-45 max-sm:border max-sm:px-3.5 max-sm:py-2.5 max-sm:text-sm max-xs:min-h-37.5"
          placeholder="Enter business value description (markdown supported)"
          rows="4"
          [value]="description()"
          [disabled]="isSaving()"
          (input)="updateDescription($event)"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
        ></textarea>
      }
    </div>

    <div
      class="mt-8 flex justify-end gap-3 border-t border-gray-200 pt-4 max-sm:mt-6 max-sm:flex-col-reverse max-sm:gap-2 max-sm:pt-3"
    >
      <button
        class="cursor-pointer rounded-lg border-[1.5px] border-gray-300 bg-white px-5 py-2.5 text-[0.9375rem] font-semibold text-gray-700 transition-all duration-200 enabled:hover:border-gray-400 enabled:hover:bg-gray-50 enabled:active:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50 max-sm:w-full max-sm:px-4 max-sm:py-3 max-sm:text-sm"
        [disabled]="isSaving()"
        (click)="close()"
      >
        Cancel
      </button>
      <button
        class="cursor-pointer rounded-lg bg-blue-500 px-5 py-2.5 text-[0.9375rem] font-semibold text-white transition-all duration-200 enabled:hover:bg-blue-600 enabled:hover:shadow-glow enabled:active:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50 max-sm:w-full max-sm:px-4 max-sm:py-3 max-sm:text-sm"
        [disabled]="isSaving() || !name().trim() || !description().trim()"
        (click)="save()"
      >
        @if (isSaving()) {
          <span>Saving...</span>
        } @else {
          <span>Save</span>
        }
      </button>
    </div>
  </div>
</app-modal>
