<div
  class="flex min-h-[calc(100vh-10rem)] flex-col px-[10vw] pt-24 pb-6 max-lg:min-h-[calc(100vh-9rem)] max-lg:px-[5vw] max-lg:pt-20 max-sm:min-h-[calc(100vh-8rem)] max-sm:px-4 max-sm:pt-24 max-sm:pb-4 max-xs:min-h-[calc(100vh-6rem)] max-xs:px-2 max-xs:pt-20"
>
  @if (showCreateForm()) {
    <app-business-value-add
      [releaseId]="releaseId()"
      (closed)="toggleCreateForm()"
      (businessValueCreated)="onBusinessValueCreated($event)"
    />
  }

  @if (showEditForm() && selectedBusinessValue()) {
    <app-business-value-edit
      [businessValue]="selectedBusinessValue()!"
      (closed)="toggleEditForm()"
      (businessValueUpdated)="onBusinessValueUpdated($event)"
    />
  }

  @if (showDeleteForm() && businessValueToDelete()) {
    <app-business-value-delete
      [businessValue]="businessValueToDelete()!"
      (closed)="closeDeleteModal()"
      (businessValueDeleted)="onBusinessValueDeleted($event)"
    />
  }

  @if (showDuplicateModal()) {
    <app-business-value-duplicate
      [targetReleaseTitle]="releaseTitle()"
      [releases]="otherReleases()"
      [isDuplicating]="isDuplicating()"
      [errorMessage]="duplicateErrorMessage()"
      (closed)="closeDuplicateModal()"
      (duplicateSelected)="duplicateFromRelease($event)"
    />
  }

  @if (!isLoading()) {
    <header class="mb-4 flex items-center justify-between border-b-2 border-gray-200 pb-3 max-md:mb-3 max-md:pb-2">
      <button
        class="back-button group flex cursor-pointer items-center gap-2 rounded-lg border-[1.5px] border-gray-300 bg-white px-5 py-2.5 text-[0.95rem] leading-none font-medium text-gray-700 transition-all duration-200 hover:-translate-x-0.5 hover:border-gray-400 hover:bg-gray-50 hover:text-gray-800 active:-translate-x-px active:bg-gray-100"
        (click)="goBack()"
      >
        <img
          class="transition-transform duration-200 group-hover:-translate-x-0.5"
          src="assets/icons/chevron-left.svg"
          alt=""
          width="20"
          height="20"
        />
        Back to Overview
      </button>

      <div class="flex flex-col items-end gap-1 text-right max-md:w-full">
        <h1 class="text-[1.75rem]/tight font-bold tracking-tight text-gray-800 max-md:text-2xl max-xs:text-xl">
          {{ releaseTitle() }}
        </h1>
        <p class="text-base leading-none font-medium text-gray-500 max-xs:text-[0.9rem]">Manage Business Values</p>
      </div>
    </header>

    <div class="grid flex-1 grid-cols-[2fr_3fr] items-start gap-4 overflow-hidden max-xl:grid-cols-1 max-sm:gap-3">
      <app-business-value-panel
        [businessValues]="businessValues()"
        [selectedBusinessValue]="selectedBusinessValue()"
        (businessValueSelected)="selectBusinessValue($event)"
        (createClicked)="toggleCreateForm()"
        (editClicked)="toggleEditForm()"
        (deleteClicked)="openDeleteModal($event.businessValue, $event.event)"
        (duplicateClicked)="openDuplicateModal()"
      />

      <app-business-value-issue-panel
        [selectedBusinessValue]="selectedBusinessValue()"
        [issuesWithSelection]="issuesWithSelection()"
        [hasChanges]="hasChanges()"
        [isSaving]="isSaving()"
        (issueToggled)="toggleIssue($event)"
        (saveClicked)="saveChanges()"
      />
    </div>
  } @else {
    <app-loader />
  }
</div>
