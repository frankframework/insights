<button
  type="button"
  class="group"
  [class]="buttonClasses()"
  [disabled]="included()"
  [attr.title]="title()"
  (click)="onClick($event)"
>
  @if (pending()) {
    <span class="group-hover:hidden">pending…</span>
    <span class="hidden group-hover:inline">× undo</span>
  } @else {
    {{ included() ? 'included' : '+ include' }}
  }
</button>
