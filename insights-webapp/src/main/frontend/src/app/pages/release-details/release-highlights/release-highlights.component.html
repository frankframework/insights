<div
  class="flex w-full min-h-115 flex-row items-center gap-10 rounded-2xl border border-gray-200 bg-white p-10 shadow-e2 max-md:min-h-auto max-md:flex-col-reverse max-md:gap-9 max-md:p-6"
>
  <div
    class="flex max-w-60 min-w-42.5 flex-none flex-col gap-6 overflow-y-auto max-md:grid max-md:w-full max-md:max-w-full max-md:grid-cols-2 max-md:justify-items-center max-md:gap-x-8 max-md:gap-y-3 max-md:overflow-y-visible"
  >
    <div class="flex flex-col gap-2">
      @if (hasHighlightRing()) {
        <p class="legend-title mb-1 text-xs font-bold tracking-[0.07em] text-gray-500 uppercase">Issue types</p>
      }
      @for (item of legendItems(); track item.label) {
        <div
          class="legend-item flex min-w-0 items-center gap-2.5 text-sm whitespace-nowrap max-md:text-[0.8rem] max-md:whitespace-normal"
        >
          <span class="size-3.5 shrink-0 rounded" [style.background]="item.color"></span>
          <span class="legend-label overflow-hidden font-medium text-ellipsis text-gray-700">{{ item.label }}</span>
          <span class="shrink-0 font-normal text-gray-500">({{ item.count }})</span>
        </div>
      }
    </div>
    @if (hasHighlightRing()) {
      <div class="flex flex-col gap-2">
        <p class="legend-title mb-1 text-xs font-bold tracking-[0.07em] text-gray-500 uppercase">Highlights</p>
        @for (item of highlightLegendItems(); track item.label) {
          <div
            class="legend-item flex min-w-0 items-center gap-2.5 text-sm whitespace-nowrap max-md:text-[0.8rem] max-md:whitespace-normal"
          >
            <span class="size-3.5 shrink-0 rounded" [style.background]="item.color"></span>
            <span class="legend-label overflow-hidden font-medium text-ellipsis text-gray-700">{{ item.label }}</span>
            <span class="shrink-0 font-normal text-gray-500">({{ item.count }})</span>
          </div>
        }
      </div>
    }
  </div>
  <div class="flex h-105 flex-1 items-center justify-center max-md:h-77.5 max-md:w-77.5 max-md:flex-none">
    <canvas
      baseChart
      class="h-full! w-full!"
      [data]="doughnutChartData()"
      [options]="doughnutChartOptions"
      [type]="'doughnut'"
      [plugins]="doughnutChartPlugins"
    >
    </canvas>
  </div>
</div>
