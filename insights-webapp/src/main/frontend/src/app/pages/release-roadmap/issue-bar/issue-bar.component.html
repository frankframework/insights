<a
  #issueLink
  target="_blank"
  class="issue-bar absolute top-0 block"
  [class.h-8]="viewMode() === ViewMode.MONTHLY"
  [class.h-7]="viewMode() !== ViewMode.MONTHLY"
  [href]="issue().url"
  [ngStyle]="issueStyle()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <div [class]="innerClasses()" [ngStyle]="priorityStyle()">
    @if (viewMode() === ViewMode.MONTHLY) {
      <span
        class="min-w-0 flex-1 overflow-hidden pr-3 text-left text-sm leading-tight font-semibold text-ellipsis whitespace-nowrap"
      >
        {{ issue().title }}
      </span>
      <div class="flex min-w-50 shrink-0 items-start justify-end gap-3">
        @if (issue().issuePriority; as issuePriority) {
          <span
            class="min-w-17.5 text-left text-[0.8125rem] font-semibold whitespace-nowrap text-black opacity-75 first-letter:text-[deepskyblue] first-letter:[text-shadow:0_0_0_black]"
          >
            {{ issuePriority.name }}
          </span>
        }
        @if (issue().points; as points) {
          <span
            class="min-w-15 shrink-0 px-2 text-left text-[0.8125rem] font-bold whitespace-nowrap text-black opacity-75"
          >
            {{ points }} pts
          </span>
        }
      </div>
    } @else {
      <span class="number text-xs font-medium whitespace-nowrap">{{ issue().number }}</span>
    }
  </div>
</a>
