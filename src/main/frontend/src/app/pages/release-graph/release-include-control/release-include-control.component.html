@if (isActive) {
  <div class="include-chip" data-cy="include-chip">
    <span class="include-chip-text">
      Showing <strong>{{ label }}</strong> + master
    </span>
    <button
      type="button"
      class="include-chip-clear"
      title="Show all supported releases again"
      aria-label="Clear included releases"
      (click)="clear()"
    >
      &times;
    </button>
  </div>
}
