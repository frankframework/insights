# Review stack: the webapp on its own, backed by the in-memory H2 database that Flyway seeds from
# db/e2e/R__Seed_Data.sql. No Postgres, no import service, no GitHub token and no Trivy, so this is
# the quickest way to click through a pull request.
#
#   ./mvnw clean package -DskipTests -pl insights-webapp -am
#   docker compose -f docker-compose.seed.yaml up -d --build
#
# Use docker-compose.yaml instead when you need real GitHub data or the import service.

name: insights-seed

services:
  insights-webapp:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: webapp
    image: ghcr.io/frankframework/insights-webapp:local-seed
    container_name: insights-webapp-seed
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local-seed
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
